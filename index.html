      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
    }

    nav ul {

      list-style: none;
      gap: 1.75rem;
      align-items: center;
    }

    nav a {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--slate);
      transition: color 0.15s ease;
    }

    nav a:hover {
      color: var(--teal);
    }

    .btn {
      display: inline-block;
      padding: 0.7rem 1.35rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.15s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {

      color: var(--white);
    }

    .btn-primary:hover {
      background-color: var(--teal-dark);
    }

    .btn-outline {

    }

      color: #99f6e4;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    .hero h1 {

    .hero-actions {

      margin-bottom: 3rem;
    }

    .trust-strip {
      display: grid;

      padding-top: 2rem;

      color: #e2e8f0;
    }

    .trust-strip strong {
      display: block;
      color: #5eead4;
      font-size: 0.78rem;

      letter-spacing: 0.05em;
      margin-bottom: 0.2rem;
    }

      line-height: 1.22;
      margin-bottom: 0.75rem;
    }

      color: var(--muted);
      font-size: 1.05rem;
    }
